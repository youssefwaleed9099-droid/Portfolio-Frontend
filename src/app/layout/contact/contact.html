<h1>Contact Me</h1>

<form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label>Name</label>
    <input type="text" formControlName="name" placeholder="Enter your name" />
  </div>

  <div class="form-group">
    <label>Phone</label>
    <input type="text" formControlName="phone" placeholder="Enter your phone" />
  </div>

  <div class="form-group">
    <label>Email</label>
    <input type="email" formControlName="email" placeholder="Enter your email" />
  </div>

  <button type="submit" [disabled]="contactForm.invalid">Send Message</button>
</form>
