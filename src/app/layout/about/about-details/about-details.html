<div class="about-container">
  <div class="about-image">
    <img [src]="myAbout.profileImage" alt="{{ myAbout.name }}" />
  </div>

  <div class="about-info">
    <h3>{{ myAbout.name }}</h3>
    <h4>{{ myAbout.title }}</h4>
    <p class="bio">{{ myAbout.bio }}</p>

    <div class="about-links">
      <a href="mailto:{{ myAbout.email }}" class="btn btn-email">Email Me</a>
      <a [href]="myAbout.resumeURL" target="_blank" class="btn btn-resume">View Resume</a>
    </div>
  </div>
</div>
