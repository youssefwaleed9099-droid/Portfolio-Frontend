<h3>{{ myProjects.title }}</h3>

<p>{{ myProjects.description }}</p>

<h4>Technologies</h4>
<ul>
  @for (tech of myProjects.technologies; track tech) {
    <li>{{ tech }}</li>
  }
</ul>

<img [src]="'http://localhost:3000/uploads/' + myProjects.image" alt="{{ myProjects.title }}" />

<p>
  Live: <a [href]="myProjects.liveURL" target="_blank">{{ myProjects.liveURL }}</a>
</p>
<p>
  GitHub: <a [href]="myProjects.GitHubURL" target="_blank">{{ myProjects.GitHubURL }}</a>
</p>
