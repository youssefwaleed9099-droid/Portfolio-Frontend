<img [src]="'http://localhost:3000/uploads/' + myProjects.image" alt="{{ myProjects.title }}" />

<h3>{{ myProjects.title }}</h3>

<p>{{ myProjects.description }}</p>

<h4>Technologies</h4>
<ul>
  @for (tech of myProjects.technologies; track tech) {
    <li>{{ tech }}</li>
  }
</ul>

<div class="actions">
  <a [href]="myProjects.liveURL" target="_blank" class="btn-live">Live Demo</a>
  <a [href]="myProjects.GitHubURL" target="_blank" class="btn-github">GitHub</a>
</div>
