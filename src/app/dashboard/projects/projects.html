<div class="body">
  <div class="form-container">
    <form (ngSubmit)="onSubmit()" [formGroup]="projectForm">
      <h2>Manage Projects</h2>

      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" placeholder="Title" formControlName="title" />
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <input
          type="text"
          placeholder="Description"
          name="description"
          formControlName="description"
        />
      </div>

      <div class="form-group" formArrayName="technologies">
        <label for="technologies">Technologies</label>
        @for (technology of getTechnology().controls; track $index) {
          <input type="text" placeholder="Technologies" [formControlName]="$index" />
          <br />
        }
        <button type="button" (click)="addTechnology()">Add Technology</button>
      </div>

      <div class="form-group">
        <label for="liveURL">Live URL</label>
        <input type="url" placeholder="Live URL" formControlName="liveURL" />
      </div>

      <div class="form-group">
        <label for="GitHubURL">GitHub URL</label>
        <input type="url" placeholder="GitHub URL" formControlName="GitHubURL" />
      </div>

      <!-- File Input -->
      <div class="form-group">
        <label for="file">Image</label>
        <input type="file" name="image" (change)="onFileSelected($event)" />
      </div>

      <!-- Submit Button -->
      <div class="form-group text-center">
        <button type="submit">Submit</button>
      </div>
    </form>
  </div>
</div>
