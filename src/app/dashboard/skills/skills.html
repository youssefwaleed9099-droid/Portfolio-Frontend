<div class="dashboard-container">
  <h2>Manage Skills</h2>

  <div class="form-card">
    <h3>{{ editSkillById ? 'Edit Skill' : 'Add New Skill' }}</h3>

    <form [formGroup]="skillForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Skill Name</label>
        <input formControlName="skill" placeholder="e.g. Angular" />
      </div>

      <div class="form-group">
        <label>Category</label>
        <input formControlName="category" placeholder="e.g. Frontend" />
      </div>

      <div class="actions">
        <button type="submit" [disabled]="skillForm.invalid">
          {{ editSkillById ? 'Update' : 'Save' }}
        </button>

        @if (editSkillById) {
          <button type="button" (click)="cancelEdit()" class="btn-cancel">Cancel</button>
        }
      </div>
    </form>
  </div>

  <div class="table-card">
    <h3>Skills List</h3>
    <table>
      <thead>
        <tr>
          <th>Skill</th>
          <th>Category</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (item of skillsList; track item._id) {
          <tr>
            <td>{{ item.skill }}</td>
            <td>{{ item.category }}</td>
            <td>
              <button (click)="onEdit(item)" class="btn-edit">Edit</button>
              <button (click)="onDelete(item._id)" class="btn-delete">Delete</button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="3">No skills found. Add one above!</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
